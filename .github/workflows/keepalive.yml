# Supabase's free tier pauses a project after ~7 days without activity. This pings the API twice a week to keep it awake.
# Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions).
name: Keep Supabase awake
on:
  schedule: [{ cron: '17 6 * * 1,4' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/shared_proofs?select=slug&limit=1" -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase responded $code"; [ "$code" = "200" ]
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
